services:
  # ── Backend (Express + MongoDB) ────────────────────────────────────────────
  - type: web
    name: soter-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false          # Set this in the Render dashboard — never commit it
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: CORS_ORIGIN
        value: https://soter-frontend.onrender.com  # Update with your actual frontend URL
      - key: PLATFORM_ADMIN_EMAIL
        value: admin@soter.io
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false          # Set a strong value in the Render dashboard

  # ── Frontend (Static Site) ─────────────────────────────────────────────────
  - type: web
    name: soter-frontend
    runtime: static
    rootDir: frontend
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
